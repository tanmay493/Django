
{% if messages %}
    
    {% for i in messages  %}
     {{i}}
        
    {% endfor %}
        
{% endif %}
    
<form method="POST">
    {% csrf_token %}

    <label>Department Name:</label>
    <input type="text" name="d_name" maxlength="20" required>
    <br><br>

    <label>Department Description:</label>
    <textarea name="d_dis" maxlength="200" required></textarea>
    <br><br>

    <button type="submit">Save Department</button>
</form>
