<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
    }

    .dashboard {
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background-color: #212529;
      color: white;
      min-height: 100vh;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      display: block;
      padding: 15px 20px;
      border-bottom: 1px solid #444;
    }

    .sidebar a:hover {
      background-color: #495057;
    }

    .logout {
      margin-top: auto;
      background-color: #dc3545;
    }

    .main-content {
      flex: 1;
      padding: 20px;
    }

    .top-header {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .content-box {
      background-color: white;
      min-height: 400px;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="d-flex dashboard">

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column">
      <h4 class="text-center py-3 border-bottom">Admin</h4>

      <a href="{% url 'add_department' %}">Dep</a>
      <a href="{% url 'add_employee' %}">Emp</a>
      <a href="{% url 'all_query' %}">All Query</a>

      <a href="{% url 'logout' %}" class="logout text-center mt-auto">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="top-header">
        <h2>Admin Dashboard</h2>
      </div>

      <div class="content-box">
        <h4>Welcome Admin</h4>
        <p>Yahan dashboard ka main content show hoga.</p>
      </div>
    </div>

  </div>

</body>
</html>
